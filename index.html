<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Data</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,#333 0%,transparent 35%),
        radial-gradient(circle at bottom right,#222 0%,transparent 35%),
        #080808;
    color:white;
}

.container{
    width:100%;
    max-width:500px;
    background:#111;
    border:1px solid #333;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
    width:65px;
    height:65px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    background:#fff;
    color:#000;
    font-size:25px;
    font-weight:900;
}

h1{
    text-align:center;
    margin-top:18px;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#888;
    margin:8px 0 25px;
    font-size:14px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#ccc;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #333;
    outline:none;
    background:#191919;
    color:white;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#fff;
    background:#202020;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    background:white;
    color:black;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    margin-top:5px;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(255,255,255,.15);
}

button:active{
    transform:scale(.98);
}

.status{
    display:none;
    text-align:center;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#182518;
    color:#8cff8c;
    font-size:13px;
}

.footer{
    text-align:center;
    color:#555;
    font-size:11px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">F</div>

    <h1>Form Data</h1>
    <p class="subtitle">
        Silakan isi data dengan lengkap
    </p>

    <form id="dataForm">

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama"
                required
            >
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="nama@email.com"
                required
            >
        </div>

        <div class="form-group">
            <label>Nomor HP</label>
            <input
                type="tel"
                id="nomor"
                placeholder="08xxxxxxxxxx"
                required
            >
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori" required>
                <option value="">Pilih kategori</option>
                <option value="Pendaftaran">Pendaftaran</option>
                <option value="Pertanyaan">Pertanyaan</option>
                <option value="Pesanan">Pesanan</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pesan / Keterangan</label>
            <textarea
                id="pesan"
                placeholder="Tulis pesan..."
                required
            ></textarea>
        </div>

        <button type="submit">
            KIRIM DATA
        </button>

        <div class="status" id="status">
            Data siap dikirim melalui email.
        </div>

    </form>

    <div class="footer">
        Form Data System
    </div>

</div>

<script>
const form = document.getElementById("dataForm");
const statusBox = document.getElementById("status");

/*
==================================================
GANTI EMAIL DI BAWAH DENGAN EMAIL TUJUAN
==================================================
*/

const EMAIL_TUJUAN = "bochgaje@gmail.com";

form.addEventListener("submit", function(e){

    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const email = document.getElementById("email").value;
    const nomor = document.getElementById("nomor").value;
    const kategori = document.getElementById("kategori").value;
    const pesan = document.getElementById("pesan").value;

    const subject =
        "Data Baru - " + nama;

    const body =
`DATA FORM

Nama Lengkap:
${nama}

Email:
${email}

Nomor HP:
${nomor}

Kategori:
${kategori}

Pesan / Keterangan:
${pesan}

-------------------------
Dikirim melalui website
`;

    const mailto =
        "mailto:" +
        EMAIL_TUJUAN +
        "?subject=" +
        encodeURIComponent(subject) +
        "&body=" +
        encodeURIComponent(body);

    statusBox.style.display = "block";

    setTimeout(() => {
        window.location.href = mailto;
    }, 500);

});
</script>

</body>
  </html>
